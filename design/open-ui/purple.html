<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BooruTagger — five dark purple themes</title>
  <style>
    :root {
      --sans: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
      --radius: 4px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--sans);
      background: #111;
      color: #f3f3f3;
    }
    .picker {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }
    .picker p { margin: 0 12px 0 0; font-size: 14px; }
    .picker a {
      color: inherit;
      text-decoration: none;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .picker a i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: -1px;
    }
    .block { padding: 20px 16px 8px; }
    .block h2 { margin: 0 0 6px; font-size: 18px; }
    .block p { margin: 0 0 12px; color: #bdbdbd; font-size: 13px; }
    .frame {
      height: 720px;
      border: 1px solid #333;
      overflow: hidden;
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-2);
      color: var(--fg-1);
      font-size: 14px;
    }
    .app[data-theme="iris"] {
      --bg-1: #292929; --bg-2: #1f1f1f; --bg-3: #141414; --bg-hover: #3d3d3d;
      --fg-1: #ffffff; --fg-2: #d6d6d6; --fg-3: #adadad;
      --stroke: #525252; --stroke-2: #3d3d3d;
      --brand: #b4a0ff; --on-brand: #1b1233; --brand-subtle: #2b2550;
    }
    .app[data-theme="grape"] {
      --bg-1: #2b242c; --bg-2: #201a22; --bg-3: #171318; --bg-hover: #3d3340;
      --fg-1: #fff7ff; --fg-2: #e4d4e8; --fg-3: #b39bb8;
      --stroke: #5a4b5e; --stroke-2: #403640;
      --brand: #d4a0ff; --on-brand: #2a1038; --brand-subtle: #3d2450;
    }
    .app[data-theme="amethyst"] {
      --bg-1: #26262f; --bg-2: #1c1c24; --bg-3: #14141b; --bg-hover: #353544;
      --fg-1: #f4f6ff; --fg-2: #c9d0ea; --fg-3: #9299b4;
      --stroke: #4a4d63; --stroke-2: #343648;
      --brand: #a5b4fc; --on-brand: #14162e; --brand-subtle: #262850;
    }
    .app[data-theme="orchid"] {
      --bg-1: #2c232b; --bg-2: #211a20; --bg-3: #181318; --bg-hover: #403040;
      --fg-1: #fff5fb; --fg-2: #f0d0e6; --fg-3: #c090b4;
      --stroke: #5e4458; --stroke-2: #423040;
      --brand: #f0abfc; --on-brand: #3b1038; --brand-subtle: #4a2448;
    }
    .app[data-theme="wine"] {
      --bg-1: #1e1824; --bg-2: #16111c; --bg-3: #0f0b14; --bg-hover: #2e2438;
      --fg-1: #f6f0ff; --fg-2: #d2c6e4; --fg-3: #9a8ab0;
      --stroke: #4a3d5c; --stroke-2: #322844;
      --brand: #c4b5fd; --on-brand: #1a1030; --brand-subtle: #2e1d4a;
    }

    .top {
      height: 48px; flex: none; display: flex; align-items: center; gap: 12px;
      padding: 0 12px; background: var(--bg-3); border-bottom: 1px solid var(--stroke-2);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .mark {
      width: 24px; height: 24px; border-radius: var(--radius); background: var(--brand);
      color: var(--on-brand); display: grid; place-items: center; font-size: 11px; font-weight: 700;
    }
    .path { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { font-size: 13px; color: var(--fg-2); }
    .ghost, .quiet {
      border: 1px solid var(--stroke); background: transparent; color: var(--fg-1);
      border-radius: var(--radius); padding: 5px 10px; font: 600 12px var(--sans);
    }
    .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 212px minmax(0, 1fr) 340px; }
    .filters, .stage, .sheet { min-width: 0; min-height: 0; overflow: auto; }
    .filters { background: var(--bg-3); padding: 12px; border-right: 1px solid var(--stroke-2); color: var(--fg-2); }
    .stage { background: var(--bg-2); display: flex; flex-direction: column; }
    .sheet { background: var(--bg-1); border-left: 1px solid var(--stroke-2); display: flex; flex-direction: column; }
    h3 { margin: 0; font-size: 14px; }
    .kicker { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--fg-3); }
    input, textarea {
      width: 100%; border-radius: var(--radius); padding: 6px 8px; font: 12px var(--mono);
      background: var(--bg-2); border: 1px solid var(--stroke); color: var(--fg-1);
    }
    .preset {
      width: 100%; margin-top: 6px; padding: 7px 8px; display: flex; justify-content: space-between;
      border: 0; border-radius: var(--radius); background: transparent; color: var(--fg-2);
      font: 600 13px var(--sans);
    }
    .preset.active { background: var(--brand-subtle); color: var(--brand); }
    .preset span { font-family: var(--mono); color: inherit; }
    .fchip, .chip, .suggest button {
      display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--stroke);
      background: var(--bg-2); color: var(--fg-1); border-radius: var(--radius);
      padding: 3px 8px; font: 11px var(--mono);
    }
    .grid-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    .grid-head p { margin: 0; color: var(--fg-3); font-size: 12px; flex: 1; }
    .grid {
      flex: 1; padding: 4px 12px 16px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; align-content: start;
    }
    .cell { padding: 4px; border: 0; border-radius: var(--radius); background: transparent; color: var(--fg-2); text-align: left; }
    .cell.cur { box-shadow: inset 0 0 0 2px var(--brand); }
    .thumb { aspect-ratio: 3 / 4; background: var(--bg-3); border-radius: var(--radius); overflow: hidden; }
    .thumb svg { width: 100%; height: 100%; display: block; }
    .fname { font: 500 10px var(--mono); }
    .preview { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 12px; background: var(--bg-2); }
    .sheet-scroll { flex: 1; overflow: auto; padding: 12px; }
    .trow { padding: 7px 0; border-bottom: 1px solid var(--stroke-2); font: 12px var(--mono); }
    .chips, .suggest { display: flex; flex-wrap: wrap; gap: 6px; }
    .foot { padding: 10px 12px; border-top: 1px solid var(--stroke-2); display: flex; gap: 6px; align-items: center; }
    .foot input { flex: 1; }
    .primary { background: var(--brand); color: var(--on-brand); border: 0; border-radius: var(--radius); padding: 6px 12px; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="picker">
    <p>Fluent 2 dark purple. Jump to a theme:</p>
    <a href="#iris"><i style="background:#b4a0ff"></i>1 Iris</a>
    <a href="#grape"><i style="background:#d4a0ff"></i>2 Grape</a>
    <a href="#amethyst"><i style="background:#a5b4fc"></i>3 Amethyst</a>
    <a href="#orchid"><i style="background:#f0abfc"></i>4 Orchid</a>
    <a href="#wine"><i style="background:#c4b5fd"></i>5 Wine</a>
  </nav>
  <div id="pages"></div>
  <template id="app-tpl">
    <div class="app">
      <header class="top">
        <div class="brand"><span class="mark">B</span> BooruTagger</div>
        <div class="path">D:\datasets\lio-vesper</div>
        <button class="ghost" type="button">Settings</button>
        <div class="count"><b>86</b> of 100 captioned</div>
      </header>
      <div class="body">
        <aside class="filters">
          <h3>Working set</h3>
          <div class="kicker">Find</div>
          <input type="text" placeholder="Filename or tag" />
          <button class="preset active" type="button">All images <span>100</span></button>
          <button class="preset" type="button">Needs caption <span>14</span></button>
          <div class="kicker">Has tag</div>
          <span class="fchip">red_jacket ×</span>
          <div class="kicker">Missing tag</div>
          <input type="text" placeholder="Add a tag filter" />
          <div class="kicker">18 shown · 18 selected</div>
        </aside>
        <section class="stage">
          <div class="grid-head">
            <p>Click selects one. Ctrl click toggles.</p>
            <button class="ghost" type="button">Select shown</button>
            <button class="ghost" type="button">Clear</button>
          </div>
          <div class="grid" data-grid></div>
        </section>
        <aside class="sheet">
          <div class="preview">
            <div class="thumb" data-focus></div>
            <div>
              <div class="fname">lio_005.png</div>
              <div class="kicker" style="margin:4px 0 0">18 selected</div>
            </div>
          </div>
          <div class="sheet-scroll">
            <div class="kicker">On every image</div>
            <div class="trow">lio_vesper</div>
            <div class="trow">1boy</div>
            <div class="trow">short_hair</div>
            <div class="trow">red_jacket</div>
            <div class="kicker">Frequently used tags</div>
            <div class="suggest">
              <button type="button">amber_eyes</button>
              <button type="button">sitting</button>
              <button type="button">white_shirt</button>
            </div>
          </div>
          <div class="foot">
            <input type="text" placeholder="Tag for every selected image" />
            <button class="primary" type="button">Add</button>
          </div>
        </aside>
      </div>
    </div>
  </template>
  <script>
    const themes = [
      { id: "iris", name: "1. Iris", note: "Cool lilac on Fluent grey." },
      { id: "grape", name: "2. Grape", note: "Warmer plum charcoal." },
      { id: "amethyst", name: "3. Amethyst", note: "Indigo-violet, cooler grey." },
      { id: "orchid", name: "4. Orchid", note: "Magenta-pink purple." },
      { id: "wine", name: "5. Wine", note: "Deepest royal purple." }
    ];
    function thumb(n) {
      const coat = n % 2 ? "#b42318" : "#c2410c";
      return `<svg viewBox="0 0 90 120" xmlns="http://www.w3.org/2000/svg"><rect width="90" height="120" fill="#3a3a3a"/><rect x="18" y="58" width="54" height="62" rx="4" fill="${coat}"/><circle cx="45" cy="40" r="18" fill="#e8d4c4"/><path d="M27 38c2-16 34-16 36 0v8H27z" fill="#243044"/></svg>`;
    }
    const pages = document.getElementById("pages");
    const tpl = document.getElementById("app-tpl");
    themes.forEach((theme) => {
      const block = document.createElement("section");
      block.className = "block";
      block.id = theme.id;
      block.innerHTML = `<h2>${theme.name}</h2><p>${theme.note}</p><div class="frame"></div>`;
      const app = tpl.content.firstElementChild.cloneNode(true);
      app.dataset.theme = theme.id;
      const grid = app.querySelector("[data-grid]");
      [5, 10, 15, 20, 25, 30, 35, 40, 45, 50].forEach((n, i) => {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell" + (i === 0 ? " cur" : "");
        cell.innerHTML = `<div class="thumb">${thumb(n)}</div><div class="fname">lio_${String(n).padStart(3, "0")}.png</div>`;
        grid.appendChild(cell);
      });
      app.querySelector("[data-focus]").innerHTML = thumb(5);
      block.querySelector(".frame").appendChild(app);
      pages.appendChild(block);
    });
  </script>
</body>
</html>
